name: Import verified project sources
on:
  workflow_dispatch:
permissions:
  contents: write
jobs:
  import:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - name: Restore prepared source files
        run: |
          node --input-type=module <<'JS'
          import fs from 'node:fs'; import path from 'node:path'; import {gunzipSync} from 'node:zlib';
          const files=JSON.parse(gunzipSync(Buffer.from('','base64')));
          for(const [file,content] of files){if(file.startsWith('/')||file.includes('..')||file.startsWith('.github/')||file.startsWith('.local/'))throw new Error('Unsafe source path');fs.mkdirSync(path.dirname(file),{recursive:true});fs.writeFileSync(file,content);}
          JS
      - run: npm ci
      - run: npm test
      - run: npm run check
      - run: npm run bundle
      - name: Commit verified sources
        run: |
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add public supabase scripts tests package.json package-lock.json README.md .gitignore
          git commit -m 'Add verified Atomi request application and SQL integration tests'
          git push origin HEAD:main
